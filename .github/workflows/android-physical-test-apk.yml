name: Controlled Physical Test APK

on:
  workflow_dispatch:

env:
  TARGET_SHA: 2a62e4184b89e284357ec7d697e663b59a4dd38a
  APK_FILENAME: FarmSyncAI-physical-test-2a62e418.apk
  ARTIFACT_NAME: FarmSyncAI-Physical-Test-2a62e418

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact HEAD
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "Error: checked-out commit does not match the authorized target."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify APK existence
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK was not generated at expected path."
            exit 1
          fi

      - name: Rename and Hash APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILENAME"
          sha256sum "$APK_FILENAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_FILENAME }}
          retention-days: 5
          if-no-files-found: error
